<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regalo Supremo 💖</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  overflow:hidden;
  background:linear-gradient(180deg,#fde4ec,#f8bbd0);
}

/* PANTALLAS */
.screen{
  position:absolute;
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

/* TARJETAS */
.card{
  width:85%;
  max-width:360px;
  background:#f8a5c2;
  padding:40px 25px;
  border-radius:30px;
  box-shadow:0 20px 60px rgba(255,105,180,0.5);
  text-align:center;
  animation:fadeIn 1s ease;
}

.card h1{ color:#d81b60; }
.card p{ color:#444; }

button{
  padding:12px 30px;
  border:none;
  border-radius:30px;
  background:white;
  color:#e91e63;
  font-weight:bold;
  margin-top:20px;
  box-shadow:0 0 15px #ff4081;
}

/* VIDEO SCREEN */
#videoScreen{
  display:none;
  background:black;
}

#bgVideo{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* TEXTO FINAL */
.finalText{
  position:absolute;
  top:15%;
  color:white;
  font-size:26px;
  text-align:center;
  text-shadow:0 0 20px #ff69b4;
  padding:20px;
}

/* BOTÓN MUSICA */
.music{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#ff4081;
  color:white;
  border-radius:50%;
  width:60px;
  height:60px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
  box-shadow:0 0 25px #ff4081;
  z-index:10;
}

/* CANVAS */
canvas{
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(30px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>
<body>

<canvas id="effects"></canvas>

<!-- PANTALLA 1 -->
<div class="screen" id="screen1">
  <div class="card" onclick="openCard()">
    <h1>¡Para Ti, Mi Amor! 💕</h1>
    <p>Toca este regalo con cariño</p>
  </div>
</div>

<!-- PANTALLA 2 -->
<div class="screen" id="screen2" style="display:none;">
  <div class="card">
    <h1>Te Amo 💖</h1>
    <p>
      Eres mi calma, mi sonrisa favorita,  
      mi lugar seguro en este mundo.
    </p>
    <button onclick="showFinal()">Ver</button>
  </div>
</div>

<!-- VIDEO FINAL -->
<div class="screen" id="videoScreen">

  <video id="bgVideo" controls preload="auto">
    <source src="Carol.mp4" type="video/mp4">
  </video>

  <div class="finalText">
    Siempre tú 🌸💖
  </div>

  <button onclick="back()" style="
  position:absolute;
  top:20px;
  left:20px;
  padding:10px 15px;
  border:none;
  border-radius:20px;
  background:white;
  color:#e91e63;">
  ← Volver
  </button>

</div>

<div class="music" onclick="toggleMusic()">🎵</div>

<audio id="audio" loop>
  <source src="Music1.mp3" type="audio/mp3">
</audio>

<script>

/* CAMBIOS DE PANTALLA */
function openCard(){
  document.getElementById("screen1").style.display="none";
  document.getElementById("screen2").style.display="flex";
}

function showFinal(){

  const audio = document.getElementById("audio");
  const video = document.getElementById("bgVideo");

  document.getElementById("screen2").style.display="none";
  document.getElementById("videoScreen").style.display="flex";

  audio.pause();
  audio.currentTime = 0;

  video.currentTime = 0;

  video.play().catch(error=>{
    console.log("Error al reproducir:",error);
  });
}

function back(){
  const audio = document.getElementById("audio");
  const video = document.getElementById("bgVideo");

  video.pause();
  video.currentTime = 0;

  document.getElementById("videoScreen").style.display="none";
  document.getElementById("screen2").style.display="flex";

  audio.play();
}

function toggleMusic(){
  let audio=document.getElementById("audio");
  if(audio.paused){ audio.play(); }
  else{ audio.pause(); }
}

/* CORAZONES NEÓN */
const canvas=document.getElementById("effects");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;

let hearts=[];

function createHeart(){
  return{
    x:Math.random()*canvas.width,
    y:canvas.height,
    size:Math.random()*20+10,
    speed:Math.random()*1+0.5,
    alpha:Math.random()
  }
}

function drawHeart(x,y,size,alpha){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.shadowBlur=25;
  ctx.shadowColor="#ff00aa";
  ctx.fillStyle="#ff1493";
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.bezierCurveTo(x+size,y-size,x+size*2,y+size,x,y+size*2);
  ctx.bezierCurveTo(x-size*2,y+size,x-size,y-size,x,y);
  ctx.fill();
  ctx.restore();
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(hearts.length<40){
    hearts.push(createHeart());
  }

  hearts.forEach((h,i)=>{
    h.y-=h.speed;
    if(h.y<0) hearts.splice(i,1);
    drawHeart(h.x,h.y,h.size,h.alpha);
  });

  requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
